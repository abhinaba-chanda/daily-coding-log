name: Build log

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build log history
        run: |
          python3 tools/build_log.py
          git log --oneline | wc -l
      - name: Push
        run: git push origin HEAD:main
